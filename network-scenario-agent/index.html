<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>情境辨析智能体｜第7课 神奇的世界</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f6f3e8;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#173d30}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:0}.stage{position:relative;width:min(100vw,1672px);aspect-ratio:1672/941;background-position:center;background-size:100% 100%;background-repeat:no-repeat;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.15)}.hotspot{position:absolute;border:0;background:transparent;border-radius:22px;cursor:pointer;transition:.18s;outline:none}.hotspot:hover,.hotspot:focus-visible{box-shadow:0 0 0 5px rgba(255,229,75,.78),0 0 25px rgba(255,157,37,.45);background:rgba(255,255,255,.08)}.hotspot::after{content:"点击互动";position:absolute;right:8px;bottom:8px;background:rgba(19,133,71,.9);color:#fff;padding:5px 9px;border-radius:999px;font-size:clamp(9px,1vw,15px);font-weight:700;opacity:0;transform:translateY(4px);transition:.18s}.hotspot:hover::after,.hotspot:focus-visible::after{opacity:1;transform:none}.h1{left:21.5%;top:25.7%;width:18.7%;height:27.6%}.h2{left:41.1%;top:25.7%;width:18.1%;height:27.6%}.h3{left:59.6%;top:25.7%;width:18.3%;height:27.6%}.h4{left:21.5%;top:54.8%;width:18.7%;height:28.5%}.h5{left:41.1%;top:54.8%;width:18.1%;height:28.5%}.h6{left:59.6%;top:54.8%;width:18.3%;height:28.5%}.robotHit{left:79.4%;top:33.5%;width:18.5%;height:50%;border-radius:45%}.agentBtn{position:absolute;right:2.2%;bottom:2.2%;min-width:150px;padding:12px 18px;border:0;border-radius:999px;background:#16964d;color:#fff;font-weight:800;font-size:clamp(14px,1.25vw,20px);box-shadow:0 7px 20px rgba(0,0,0,.2);cursor:pointer}.agentBtn:hover{filter:brightness(1.07)}.overlay{position:absolute;inset:0;background:rgba(8,33,22,.42);display:none;align-items:center;justify-content:center;padding:4%;backdrop-filter:blur(2px)}.overlay.show{display:flex}.dialog{width:min(760px,92%);max-height:88%;overflow:auto;background:linear-gradient(180deg,#fff,#f4fff5);border:4px solid #46ad62;border-radius:28px;box-shadow:0 20px 55px rgba(0,0,0,.28);padding:24px;position:relative}.close{position:absolute;right:14px;top:12px;width:42px;height:42px;border:0;border-radius:50%;background:#eef4ef;font-size:24px;cursor:pointer}.agentHead{display:flex;gap:14px;align-items:center;padding-right:45px}.face{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:#e4f6ff;border:3px solid #56b2e5}.agentHead h2{margin:0;color:#108143;font-size:clamp(22px,2.2vw,34px)}.agentHead p{margin:5px 0 0;color:#527064}.question{margin:20px 0 14px;padding:15px;border-radius:18px;background:#f2faf2;font-weight:700;font-size:clamp(17px,1.6vw,23px)}.choice{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice button{min-height:58px;border:0;border-radius:16px;color:#fff;font-weight:800;font-size:20px;cursor:pointer}.good{background:#22aa55}.bad{background:#ef5656}.choice button.active{outline:5px solid #ffe066;outline-offset:2px}.reasonLabel{display:block;margin-top:18px;font-weight:800}textarea{width:100%;margin-top:8px;min-height:105px;border:2px solid #b9d8c0;border-radius:16px;padding:13px;font:inherit;font-size:16px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions button{min-height:46px;border:0;border-radius:14px;padding:0 18px;font-weight:800;cursor:pointer}.review{background:#147fdd;color:#fff}.speak{background:#ffb52e;color:#503300}.next{background:#1fa05a;color:#fff}.feedback{margin-top:16px;padding:15px;border-radius:16px;background:#fff7d8;border:2px solid #f0d56d;line-height:1.7;font-size:16px}.progress{margin-top:16px;display:flex;align-items:center;gap:12px}.bar{flex:1;height:12px;background:#e3ece5;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22aa55,#42b7ef)}.small{font-size:14px;color:#5c7568}@media(max-width:700px){.dialog{padding:18px}.choice{grid-template-columns:1fr}.agentBtn{min-width:0;padding:10px 13px}.face{width:52px;height:52px}.hotspot{border-radius:12px}.hotspot::after{display:none}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="第7课神奇的世界情境辨析智能体">
<button class="hotspot h1" data-i="0" aria-label="情境1 在网上和同学交流学习"></button><button class="hotspot h2" data-i="1" aria-label="情境2 长时间玩网络游戏"></button><button class="hotspot h3" data-i="2" aria-label="情境3 睡觉前还刷短视频"></button><button class="hotspot h4" data-i="3" aria-label="情境4 观看科普知识视频"></button><button class="hotspot h5" data-i="4" aria-label="情境5 和陌生人随意聊天"></button><button class="hotspot h6" data-i="5" aria-label="情境6 在网上购买学习用品"></button><button class="hotspot robotHit" id="robotHit" aria-label="和小智智能体对话"></button><button class="agentBtn" id="agentBtn">🤖 和小智聊一聊</button>
<section class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><div class="dialog"><button class="close" id="closeBtn" aria-label="关闭">×</button><div class="agentHead"><div class="face">🤖</div><div><h2 id="dlgTitle">小智网络使用智能体</h2><p>我会根据你的判断和理由，给出课堂即时点评。</p></div></div><div class="question" id="question">请选择一个情境开始。</div><div class="choice"><button class="good" id="goodBtn">✓ 我认为合理</button><button class="bad" id="badBtn">✕ 我认为有问题</button></div><label class="reasonLabel" for="reason">说说你的理由：</label><textarea id="reason" maxlength="220" placeholder="例如：我认为这样有问题，因为……"></textarea><div class="actions"><button class="review" id="reviewBtn">✨ 请小智点评</button><button class="speak" id="speakBtn">🔊 朗读点评</button><button class="next" id="nextBtn">下一个情境 →</button></div><div class="feedback" id="feedback">小智：先作出判断，再写一句理由吧！</div><div class="progress"><div class="bar"><i id="bar"></i></div><strong id="prog">0 / 6</strong></div><div class="small" id="scoreText">已完成 0 个情境。</div></div></section>
</main>
<script src="bg.js"></script>
<script>
const scenarios=[{t:"在网上和同学交流学习",ans:"good",hint:"合理。网络能帮助同学交流学习，但要文明表达，并保护个人信息。"},{t:"长时间玩网络游戏",ans:"bad",hint:"有问题。长时间游戏会挤占学习、运动和休息时间，需要合理控制时长。"},{t:"睡觉前还刷短视频",ans:"bad",hint:"有问题。睡前长时间看屏幕可能影响睡眠质量，也会影响第二天的学习状态。"},{t:"观看科普知识视频",ans:"good",hint:"合理。优质科普内容有助于增长知识，但要注意来源可靠、观看时间适度。"},{t:"和陌生人随意聊天",ans:"bad",hint:"有问题。与陌生人交流要提高警惕，不随意透露姓名、学校、住址、电话等隐私。"},{t:"在网上购买学习用品",ans:"good",hint:"合理。在家长指导下使用正规平台，核对商品信息并注意支付安全。"}];let current=0,choice=null;const done=Array(6).fill(false),correct=Array(6).fill(false);const $=id=>document.getElementById(id);$("stage").style.backgroundImage=`url(${window.BG})`;function openAgent(i){current=i;choice=null;$("question").textContent=`情境 ${i+1}：${scenarios[i].t}。你认为这种网络使用方式合理吗？`;$("reason").value="";$("feedback").textContent="小智：请选择“合理”或“有问题”，再说说你的理由。";$("goodBtn").classList.remove("active");$("badBtn").classList.remove("active");$("overlay").classList.add("show")}document.querySelectorAll(".hotspot[data-i]").forEach(b=>b.addEventListener("click",()=>openAgent(+b.dataset.i)));$("robotHit").addEventListener("click",()=>openAgent(current));$("agentBtn").addEventListener("click",()=>openAgent(current));$("closeBtn").addEventListener("click",()=>$("overlay").classList.remove("show"));$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))$("overlay").classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key==="Escape")$("overlay").classList.remove("show")});function choose(v){choice=v;$("goodBtn").classList.toggle("active",v==="good");$("badBtn").classList.toggle("active",v==="bad")}$("goodBtn").addEventListener("click",()=>choose("good"));$("badBtn").addEventListener("click",()=>choose("bad"));function makeReview(){const txt=$("reason").value.trim();if(!choice)return"小智：你还没有选择“合理”或“有问题”哦。先完成判断吧！";if(txt.length<4)return"小智：判断已经收到。请再补充一句理由，比如它是否安全、是否影响健康或学习。";const s=scenarios[current],ok=choice===s.ans;done[current]=true;correct[current]=ok;const tags=[];if(/安全|隐私|陌生|诈骗|支付|个人信息|家长/.test(txt))tags.push("网络安全");if(/健康|睡眠|休息|时间|视力|沉迷|运动/.test(txt))tags.push("健康用网");if(/学习|知识|科普|作业|资料|同学/.test(txt))tags.push("学习与交流");let msg=ok?"🌟 判断正确！":"🔎 这个判断还可以再想一想。";msg+=" "+s.hint;if(tags.length)msg+=` 你的理由还关注到了“${tags.join("、")}”，这一点很好。`;else msg+=" 如果能再从安全、健康或学习影响中补充一个角度，理由会更完整。";updateProgress();return msg}$("reviewBtn").addEventListener("click",()=>{$("feedback").textContent=makeReview()});$("speakBtn").addEventListener("click",()=>{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($("feedback").textContent);u.lang="zh-CN";u.rate=.95;speechSynthesis.speak(u)});$("nextBtn").addEventListener("click",()=>openAgent((current+1)%6));function updateProgress(){const n=done.filter(Boolean).length,c=correct.filter(Boolean).length;$("bar").style.width=n/6*100+"%";$("prog").textContent=`${n} / 6`;$("scoreText").textContent=n===6?`全部完成！你答对了 ${c} 个情境。`:`已完成 ${n} 个情境，其中答对 ${c} 个。`}
</script>
</body></html>
