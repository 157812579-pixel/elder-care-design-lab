<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>在线学习｜网络作用探索智能体</title><style>
:root{--g:#1b8a46;--g2:#6bc959;--o:#ff9e31;--ink:#183521;--glass:rgba(255,255,255,.95);--line:rgba(106,190,92,.5)}*{box-sizing:border-box}html,body{margin:0;background:#eef7eb;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink)}button,input{font:inherit}.app{max-width:1680px;margin:auto;padding:10px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-bottom:8px;border-radius:16px;background:#fffffff0;box-shadow:0 6px 20px #0000000f}.title{font-weight:900;color:#16703a;font-size:19px}.sub{font-size:12px;color:#67786c}.actions{display:flex;gap:7px}.actions button{border:0;border-radius:11px;padding:8px 12px;background:#edf8e9;color:#176f38;font-weight:800;cursor:pointer}.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:24px;box-shadow:0 20px 60px #1649203d;background:#ddd}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hotspot{position:absolute;z-index:6;border:3px solid transparent;border-radius:18px;background:#ffffff00;cursor:pointer;transition:.18s}.hotspot:hover,.hotspot:focus-visible{border-color:#ffe15ceb;box-shadow:0 0 0 7px #ffe15c38;outline:none}.hotspot.active{border-color:#ffe35d;box-shadow:0 0 0 8px #ffe35d38}.robot-hot{position:absolute;right:1.5%;top:43%;width:15%;height:34%;z-index:7;border:0;background:transparent;cursor:pointer;border-radius:50%;animation:rp 1.6s infinite}@keyframes rp{50%{filter:drop-shadow(0 0 22px #8ef277)}}.panel{position:absolute;z-index:20;right:18%;top:18%;width:34%;min-height:55%;background:var(--glass);backdrop-filter:blur(16px);border:2px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 18px 52px #10421b40;display:none}.panel.show{display:block;animation:pop .27s ease}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.agent-id{display:flex;gap:10px;align-items:center}.orb{width:48px;height:48px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#efffff,#43e3c1 42%,#0b7a59 76%)}.orb:before,.orb:after{content:"";position:absolute;top:17px;width:7px;height:9px;border-radius:50%;background:#0b3540;animation:blink 4s infinite}.orb:before{left:11px}.orb:after{right:11px}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}.agent-name{font-weight:900;color:#14723a;font-size:17px}.agent-role{font-size:11px;color:#68796c}.close{width:36px;height:36px;border-radius:50%;border:0;background:#eef4ed;font-size:20px;font-weight:900;cursor:pointer}.speech{padding:12px;border-radius:14px;background:#eff9ec;line-height:1.6;font-weight:700;min-height:64px}.task-card{margin-top:10px;padding:12px;border-radius:15px;background:#fff7df;border:1px solid #f1d88a}.task-title{font-weight:900;color:#795d16;margin-bottom:7px}.task-image{width:100%;height:150px;object-fit:cover;border-radius:12px;background:white;display:block;margin-bottom:9px}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.options button,.main-btn{border:0;border-radius:12px;min-height:42px;padding:8px 10px;font-weight:900;cursor:pointer}.options button{background:#eef8ea;color:#166f39}.options button.correct{background:#e8f8e6}.options button.wrong{background:#fff1df;color:#a05716}.main-btn{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff}.answer{display:flex;gap:7px;margin-top:10px}.answer input{min-width:0;flex:1;border:1px solid #d5e6d2;border-radius:11px;padding:10px}.answer button{border:0;border-radius:11px;padding:0 12px;background:var(--o);color:#fff;font-weight:900;cursor:pointer}.result{margin-top:8px;padding:10px;border-radius:12px;background:#f5fbf3;min-height:42px;font-size:13px;font-weight:700}.searchbox{display:flex;gap:7px}.searchbox input{min-width:0;flex:1;border:1px solid #d8e7d4;border-radius:11px;padding:10px}.searchbox button{border:0;border-radius:11px;background:#20a451;color:white;font-weight:900;padding:0 12px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{border-radius:999px;padding:7px 10px;background:#edf8e9;color:#176d37;font-weight:800}.video-demo{height:100px;border-radius:12px;background:linear-gradient(135deg,#78c7ff,#dff5ff);display:grid;place-items:center}.play{width:56px;height:56px;border-radius:50%;border:0;background:#fffffff2;font-size:26px;color:#249856;cursor:pointer}.progress{height:9px;border-radius:999px;background:#d9e5d9;overflow:hidden;margin-top:9px}.progress i{display:block;width:0;height:100%;background:#53be5d}.progress.playing i{animation:prog 6s linear forwards}@keyframes prog{to{width:100%}}.book{height:110px;border-radius:12px;background:#f7f0dc;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:9px}.book .page{background:white;border-radius:8px;padding:8px;font-size:11px;line-height:1.5}.upload{border:2px dashed #a9d1a6;border-radius:14px;padding:12px;text-align:center;background:#fbfffa}.quick{position:absolute;z-index:18;left:35%;bottom:4.2%;display:flex;gap:7px;flex-wrap:wrap}.quick button{border:0;border-radius:999px;padding:8px 12px;background:#fffffff0;color:#166d37;font-weight:900;cursor:pointer;box-shadow:0 7px 20px #0000001f}.quick button.active{background:#ffe67c;color:#6a5211}.toast{position:absolute;left:50%;bottom:1.6%;transform:translateX(-50%);z-index:40;background:#183521ef;color:white;padding:10px 15px;border-radius:12px;font-weight:800;display:none}.toast.show{display:block}@media(max-width:900px){.panel{right:13%;width:43%;top:14%}.quick{left:24%}}@media(max-width:650px){.sub{display:none}.panel{right:2%;width:58%;top:9%;padding:10px}.agent-role{display:none}.speech{font-size:12px}.options{grid-template-columns:1fr}.quick{left:8%;bottom:2%}.task-image{height:90px}}
</style></head><body><div class="app"><div class="toolbar"><div><div class="title">在线学习 · 网络作用探索智能体</div><div class="sub">点击屏幕中的功能卡，让“小智”完成对应课堂任务</div></div><div class="actions"><button id="speak">🔊 小智朗读</button><button id="reset">↺ 重置</button></div></div><div class="stage"><img class="bg" id="bg" alt="在线学习网络作用探索页"><button class="hotspot" data-task="class" style="left:22.8%;top:44.6%;width:18%;height:19%"></button><button class="hotspot" data-task="search" style="left:41.8%;top:44.6%;width:18%;height:19%"></button><button class="hotspot" data-task="video" style="left:60.7%;top:44.6%;width:18%;height:19%"></button><button class="hotspot" data-task="homework" style="left:22.7%;top:64.5%;width:27.1%;height:19.2%"></button><button class="hotspot" data-task="reading" style="left:50.5%;top:64.5%;width:28.1%;height:19.2%"></button><button class="robot-hot" id="robotHot"></button><div class="quick"><button data-open="class">在线课堂</button><button data-open="search">查找资料</button><button data-open="video">教学视频</button><button data-open="homework">提交作业</button><button data-open="reading">电子阅读</button></div><section class="panel" id="panel" aria-live="polite"><div class="panel-head"><div class="agent-id"><div class="orb"></div><div><div class="agent-name" id="agentName">网络作用探索智能体 · 小智</div><div class="agent-role" id="agentRole">点击功能卡 · 发现网络作用 · 即时反馈</div></div></div><button class="close" id="close">×</button></div><div class="speech" id="speech">网络真神奇！请点一项功能，我们一起看看网络怎样帮助学习。</div><div id="taskArea"></div><div class="answer"><input id="answer" placeholder="教师可输入学生回答"><button id="analyze">分析</button></div><div class="result" id="result">评价标准：说出具体功能 + 说明它带来的学习便利。</div></section><div class="toast" id="toast"></div></div></div><script src="bg.js"></script><script src="thumbs.js"></script><script>
(()=>{document.querySelector('#bg').src=window.BG;const panel=document.querySelector('#panel'),speech=document.querySelector('#speech'),taskArea=document.querySelector('#taskArea'),result=document.querySelector('#result'),answer=document.querySelector('#answer'),toast=document.querySelector('#toast');let timer=null;const imgs=window.THUMBS;const tasks={class:{name:'在线课堂智能体',role:'实时互动 · 共同学习',speech:'在线课堂让老师和同学隔着屏幕也能一起上课、交流。你发现它最大的方便是什么？',html:()=>`<div class="task-card"><img class="task-image" src="${imgs.class}"><div class="task-title">小任务：在线课堂最突出地体现了什么？</div><div class="options"><button data-opt="yes">实时互动</button><button data-opt="no">只能看不能说</button><button data-opt="yes">异地也能共同学习</button><button data-opt="no">必须在同一教室</button></div></div>`},search:{name:'资料检索智能体',role:'关键词搜索 · 信息筛选',speech:'网络像一座巨大的知识库。输入一个关键词，我来模拟帮你查找学习资料。',html:()=>`<div class="task-card"><img class="task-image" src="${imgs.search}"><div class="task-title">模拟查找资料</div><div class="searchbox"><input id="searchInput" placeholder="例如：宇宙、动物、科学"><button id="doSearch">搜索</button></div><div class="chips" id="searchResult"><span class="chip">宇宙知识</span><span class="chip">动物世界</span><span class="chip">科学实验</span></div></div>`},video:{name:'视频学习智能体',role:'观看视频 · 重点提取',speech:'教学视频可以暂停、回看，帮助我们把不懂的地方再学一遍。点击播放试一试。',html:()=>`<div class="task-card"><img class="task-image" src="${imgs.video}"><div class="task-title">模拟教学视频</div><div class="video-demo"><button class="play" id="playVideo">▶</button></div><div class="progress" id="progress"><i></i></div></div>`},homework:{name:'作业提交智能体',role:'在线提交 · 快速反馈',speech:'网络还能帮助我们提交作业。完成以后，老师可以更快地看到并反馈。',html:()=>`<div class="task-card"><img class="task-image" src="${imgs.homework}"><div class="task-title">模拟提交作业</div><div class="upload">📄 我的作业：网络让学习更方便<br><button class="main-btn" id="submitWork" style="margin-top:8px">提交作业</button><div id="workStatus" style="margin-top:7px;font-weight:900;color:#17733a">等待提交</div></div></div>`},reading:{name:'电子阅读智能体',role:'在线阅读 · 开阔视野',speech:'电子阅读让我们随时打开电子书籍，查阅内容、拓宽视野。点击翻页看看。',html:()=>`<div class="task-card"><img class="task-image" src="${imgs.reading}"><div class="task-title">电子阅读体验</div><div class="book"><div class="page"><b>第一页</b><br>互联网让知识更容易获取。</div><div class="page"><b>第二页</b><br>我们也要选择可靠的信息。</div></div><button class="main-btn" id="flipBook" style="margin-top:8px">翻一页</button></div>`}};function say(t,v=false){speech.textContent=t;if(v&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.95;speechSynthesis.speak(u)}}function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}function openTask(k){const t=tasks[k];panel.classList.add('show');agentName.textContent=t.name;agentRole.textContent=t.role;say(t.speech);taskArea.innerHTML=t.html();result.textContent='评价标准：说出具体功能 + 说明它带来的学习便利。';document.querySelectorAll('.hotspot').forEach(x=>x.classList.toggle('active',x.dataset.task===k));document.querySelectorAll('.quick button').forEach(x=>x.classList.toggle('active',x.dataset.open===k));bind(k)}function bind(k){taskArea.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.opt==='yes'){b.classList.add('correct');result.textContent='判断正确！再说一说：为什么它能让学习更方便？'}else{b.classList.add('wrong');result.textContent='再想一想：在线课堂可以实时互动，也能突破地点限制。'}}));if(k==='search')doSearch?.addEventListener('click',()=>{const q=searchInput.value.trim();if(!q){result.textContent='请输入一个学习关键词。';return}searchResult.innerHTML=`<span class="chip">${q}·图文资料</span><span class="chip">${q}·学习视频</span><span class="chip">${q}·知识百科</span>`;result.textContent='找到了不同类型的学习资料。还要学会判断哪些信息可靠。'});if(k==='video')playVideo?.addEventListener('click',()=>{progress.classList.remove('playing');void progress.offsetWidth;progress.classList.add('playing');result.textContent='模拟播放中：不懂的地方可以暂停、回看。';clearTimeout(timer);timer=setTimeout(()=>result.textContent='播放结束。请说说教学视频给学习带来了什么方便？',6100)});if(k==='homework')submitWork?.addEventListener('click',()=>{workStatus.textContent='✓ 提交成功';result.textContent='提交成功！网络让作业提交更方便，也让老师反馈更及时。'});if(k==='reading')flipBook?.addEventListener('click',()=>{result.textContent='翻页成功。电子阅读让我们在一个设备上阅读更多内容，开阔视野。';toastMsg('已翻到下一页')})}document.querySelectorAll('.hotspot[data-task]').forEach(b=>b.addEventListener('click',()=>openTask(b.dataset.task)));document.querySelectorAll('.quick button').forEach(b=>b.addEventListener('click',()=>openTask(b.dataset.open)));robotHot.addEventListener('click',()=>{panel.classList.add('show');say('网络真神奇！请点一项功能，我们一起看看网络怎样帮助学习。',true)});close.addEventListener('click',()=>panel.classList.remove('show'));speak.addEventListener('click',()=>say(speech.textContent,true));reset.addEventListener('click',()=>location.reload());analyze.addEventListener('click',()=>{const t=answer.value.trim();if(!t){result.textContent='请先输入一条学生回答。';return}const a=/课堂|资料|搜索|视频|作业|阅读|电子书|网络/.test(t),b=/方便|及时|互动|学习|知识|查找|回看|提交|视野|交流|省时/.test(t);result.textContent=a&&b?'回答达标：既有具体功能，也说清了网络带来的学习便利。':a?'已经说出具体功能，再补一句它带来了什么方便。':b?'已经说到作用，再补一个具体功能作为例子。':'可以从“在线课堂、查找资料、教学视频、提交作业、电子阅读”中选一个例子。'});panel.classList.add('show')})();
</script></body></html>
