<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线学习｜网络作用探索智能体</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(135deg,#eef8ea,#fff7e4);color:#183521}.app{max-width:1500px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}.title{font-size:clamp(30px,4vw,56px);font-weight:900;color:#18733a;text-shadow:0 3px 0 #fff}.badge{padding:10px 18px;border-radius:999px;background:linear-gradient(135deg,#218646,#6dca56);color:#fff;font-weight:900}.board{background:rgba(255,255,255,.94);border:7px solid #3d6651;border-radius:28px;padding:18px;box-shadow:0 20px 60px rgba(22,73,32,.18)}.intro{text-align:center;margin-bottom:14px}.intro h2{margin:0;color:#176f38;font-size:clamp(24px,3vw,42px)}.intro p{margin:6px 0;color:#68796d;font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:0;border-radius:22px;padding:0;overflow:hidden;cursor:pointer;background:white;box-shadow:0 10px 24px rgba(0,0,0,.09);transition:.18s;text-align:left}.card:hover{transform:translateY(-4px)}.pic{height:180px;display:grid;place-items:center;font-size:72px;position:relative}.pic:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.15))}.c1 .pic{background:linear-gradient(135deg,#81d3ff,#dff6ff)}.c2 .pic{background:linear-gradient(135deg,#8ff0b4,#e7ffdc)}.c3 .pic{background:linear-gradient(135deg,#ffd16e,#fff0bf)}.c4 .pic{background:linear-gradient(135deg,#ff99c5,#ffe2f0)}.c5 .pic{background:linear-gradient(135deg,#b79cff,#ece4ff)}.body{padding:13px 15px 15px}.name{font-size:22px;font-weight:900;color:#176f38}.desc{font-size:14px;line-height:1.6;color:#4d6453;margin-top:5px}.wide{grid-column:span 1}.agent{margin-top:16px;display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:#f2faef;border:2px solid #cfe8c8;border-radius:24px;padding:14px}.robot{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f4fbff,#d6ebec);font-size:64px;animation:float 2.4s ease-in-out infinite;box-shadow:0 10px 24px rgba(0,0,0,.1)}@keyframes float{50%{transform:translateY(-7px)}}.agent h3{margin:0;color:#176f38;font-size:22px}.speech{margin-top:6px;padding:11px 13px;border-radius:14px;background:#fff;line-height:1.6;font-weight:700;min-height:50px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.actions button,.modal button{border:0;border-radius:12px;padding:9px 13px;font-weight:900;cursor:pointer;background:#1f8647;color:#fff}.actions .sub{background:#eef4ed;color:#4f6754}.answer{display:flex;gap:8px;margin-top:9px}.answer input{flex:1;min-width:0;border:1px solid #d6e5d2;border-radius:11px;padding:10px;font-size:16px}.answer button{border:0;border-radius:11px;padding:0 13px;background:#f39b2f;color:#fff;font-weight:900;cursor:pointer}.modal{display:none;margin-top:15px;background:#fff;border:2px solid #d8ead3;border-radius:22px;padding:16px}.modal.show{display:block;animation:pop .22s ease}@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.modal h3{margin:0;color:#176f38;font-size:24px}.visual{height:210px;border-radius:18px;margin:12px 0;display:grid;place-items:center;font-size:88px;background:linear-gradient(135deg,#eef9eb,#fff6da)}.task{padding:12px;border-radius:14px;background:#fff7dc;font-weight:800}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.choices button{background:#edf8e9;color:#176f38}.search{display:flex;gap:8px;margin-top:10px}.search input{flex:1;border:1px solid #d5e6d2;border-radius:11px;padding:10px}.result{margin-top:10px;padding:10px;border-radius:12px;background:#eef8ea;font-weight:800;min-height:42px}.bar{height:12px;background:#e3ebe1;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:#55be5d}.bar.play i{animation:prog 6s linear forwards}@keyframes prog{to{width:100%}}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.agent{grid-template-columns:90px 1fr}.robot{width:82px;height:82px;font-size:48px}}@media(max-width:560px){.cards{grid-template-columns:1fr}.agent{grid-template-columns:1fr;text-align:center}.robot{margin:auto}.choices{grid-template-columns:1fr}}
</style></head><body><div class="app"><div class="head"><div><div class="title">在线学习</div><div style="font-weight:900;color:#4c6b54">第7课《神奇的世界》· 网络作用探索页</div></div><div class="badge">🤖 网络作用探索智能体</div></div><div class="board"><div class="intro"><h2>丰富的学习资源，让知识触手可及</h2><p>点击下面的学习方式，看看网络怎样帮助我们学习。</p></div><div class="cards">
<button class="card c1" data-task="class"><div class="pic">👩‍🏫🧑‍💻</div><div class="body"><div class="name">在线课堂</div><div class="desc">和老师同学一起上课，实时互动，异地也能共同学习。</div></div></button>
<button class="card c2" data-task="search"><div class="pic">🔎📚</div><div class="body"><div class="name">查找资料</div><div class="desc">上网搜索需要的知识，找到更多有用的学习资料。</div></div></button>
<button class="card c3" data-task="video"><div class="pic">▶️🖥️</div><div class="body"><div class="name">观看教学视频</div><div class="desc">观看生动有趣的教学视频，不懂的地方还能暂停、回看。</div></div></button>
<button class="card c4" data-task="homework"><div class="pic">📄✅</div><div class="body"><div class="name">提交作业</div><div class="desc">在网上完成并提交作业，老师可以更快查看并反馈。</div></div></button>
<button class="card c5" data-task="reading"><div class="pic">📖📱</div><div class="body"><div class="name">电子阅读</div><div class="desc">在线阅读电子书籍，开阔视野，丰富知识。</div></div></button></div>
<div class="agent"><div class="robot">🤖</div><div><h3>小智 · 网络作用探索智能体</h3><div class="speech" id="speech">网络真神奇！请选择一种学习方式，我们一起看看它带来了什么方便。</div><div class="actions"><button id="speak">🔊 小智朗读</button><button class="sub" id="hint">给一个提示</button></div><div class="answer"><input id="answer" placeholder="教师可输入学生回答"><button id="analyze">分析</button></div></div></div>
<div class="modal" id="modal"><div class="modal-head"><h3 id="mTitle">在线课堂</h3><button id="close">关闭</button></div><div class="visual" id="visual">👩‍🏫🧑‍💻</div><div class="task" id="taskText"></div><div id="interactive"></div><div class="result" id="result">请完成小任务。</div></div></div></div>
<script>
(()=>{const modal=document.querySelector('#modal'),title=document.querySelector('#mTitle'),visual=document.querySelector('#visual'),task=document.querySelector('#taskText'),box=document.querySelector('#interactive'),result=document.querySelector('#result'),speech=document.querySelector('#speech');let current='';const data={class:{title:'在线课堂',icon:'👩‍🏫🧑‍💻',say:'在线课堂让我们隔着屏幕也能一起上课、交流。你发现它最大的方便是什么？',task:'判断：下面哪些说法体现了在线课堂的作用？',html:'<div class="choices"><button data-ok="1">实时互动</button><button data-ok="0">只能看不能说</button><button data-ok="1">异地也能一起学习</button><button data-ok="0">必须在同一教室</button></div>'},search:{title:'查找资料',icon:'🔎📚',say:'网络像一座巨大的知识库。输入一个关键词，我来模拟帮你查找资料。',task:'输入一个学习关键词。',html:'<div class="search"><input id="q" placeholder="如：宇宙、动物、科学"><button id="go">搜索</button></div>'},video:{title:'观看教学视频',icon:'▶️🖥️',say:'教学视频可以暂停、回看，帮助我们把不懂的地方再学一遍。',task:'点击播放，观察进度条。',html:'<button id="play">▶ 播放模拟视频</button><div class="bar" id="bar"><i></i></div>'},homework:{title:'提交作业',icon:'📄✅',say:'网络还能帮助我们提交作业，老师也能更快反馈。',task:'模拟提交一次作业。',html:'<button id="submit">提交作业</button>'},reading:{title:'电子阅读',icon:'📖📱',say:'电子阅读让我们随时打开电子书，查阅内容、开阔视野。',task:'点击翻页，体验电子阅读。',html:'<button id="flip">翻到下一页</button>'}};function say(t,voice=false){speech.textContent=t;if(voice&&speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.95;speechSynthesis.speak(u)}}function open(k){current=k;const d=data[k];title.textContent=d.title;visual.textContent=d.icon;task.textContent=d.task;box.innerHTML=d.html;result.textContent='请完成小任务。';modal.classList.add('show');say(d.say);bind(k)}function bind(k){box.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{result.textContent=b.dataset.ok==='1'?'判断正确！请再说说为什么它让学习更方便。':'再想一想：网络学习可以实时互动，也能突破地点限制。'});if(k==='search')box.querySelector('#go').onclick=()=>{const q=box.querySelector('#q').value.trim();result.textContent=q?'已找到：'+q+'·图文资料、'+q+'·学习视频、'+q+'·知识百科。':'请先输入一个关键词。'};if(k==='video')box.querySelector('#play').onclick=()=>{const bar=box.querySelector('#bar');bar.classList.remove('play');void bar.offsetWidth;bar.classList.add('play');result.textContent='模拟播放中：不懂的地方可以暂停、回看。'};if(k==='homework')box.querySelector('#submit').onclick=()=>result.textContent='✓ 提交成功！网络让作业提交更方便，反馈更及时。';if(k==='reading')box.querySelector('#flip').onclick=()=>{visual.textContent='📱📖✨';result.textContent='已翻到下一页！电子阅读能帮助我们阅读更多内容。'}}document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>open(b.dataset.task));document.querySelector('#close').onclick=()=>modal.classList.remove('show');document.querySelector('#speak').onclick=()=>say(speech.textContent,true);document.querySelector('#hint').onclick=()=>say('可以从“在线课堂、查找资料、教学视频、提交作业、电子阅读”中选一个具体例子，说清楚它带来的方便。');document.querySelector('#analyze').onclick=()=>{const t=document.querySelector('#answer').value.trim();if(!t)return say('请先输入一条学生回答。');const a=/课堂|资料|搜索|视频|作业|阅读|电子书|网络/.test(t),b=/方便|及时|互动|学习|知识|查找|回看|提交|视野|交流|省时/.test(t);say(a&&b?'回答达标：既有具体功能，也说清了网络带来的学习便利。':a?'已经说出具体功能，再补一句它带来了什么方便。':b?'已经说到作用，再补一个具体功能作为例子。':'可以从五种学习方式中选一个具体例子来说明。')};})();
</script></body></html>
