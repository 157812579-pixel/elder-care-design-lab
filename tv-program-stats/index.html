<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我最喜欢的节目｜兴趣统计</title>
<style>
:root{
  --green:#1f7d3f;
  --green2:#65c65b;
  --cream:#fff9e8;
  --ink:#203427;
  --muted:#6d7c70;
  --panel:rgba(255,255,255,.94);
  --line:#d8ead5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:
radial-gradient(circle at 12% 8%,#f9e8b0 0 7%,transparent 23%),
linear-gradient(135deg,#eef8e9,#fff7df);color:var(--ink)}
body{min-height:100vh}
.app{max-width:1500px;margin:auto;padding:18px}
.header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.title-wrap{display:flex;align-items:center;gap:12px}
.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#2b8b47,#73ce58);font-size:30px;color:white;box-shadow:0 10px 24px rgba(31,125,63,.22)}
h1{margin:0;font-size:clamp(28px,3vw,48px);color:#176b35}
.subtitle{margin-top:4px;color:var(--muted);font-size:15px}
.badge{background:linear-gradient(135deg,#2a8846,#6bc757);color:white;padding:10px 18px;border-radius:999px;font-weight:900;box-shadow:0 8px 18px rgba(31,125,63,.18)}
.main{display:grid;grid-template-columns:390px minmax(0,1fr);gap:16px;align-items:stretch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 46px rgba(34,96,45,.12)}
.input-card{padding:20px}.input-card h2,.chart-card h2{margin:0;color:#176b35}.hint{margin:6px 0 16px;color:var(--muted);font-size:14px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:42px 1fr 82px;gap:8px;align-items:center;padding:10px;border:1px solid #e1eee0;border-radius:16px;background:#fbfff9}
.icon{font-size:27px;text-align:center}.name{font-weight:900;font-size:15px}
.num{width:82px;border:2px solid #dcebdd;border-radius:12px;padding:9px 8px;font-size:18px;font-weight:900;text-align:center;color:#176b35;background:white}
.num:focus{outline:none;border-color:#65c65b;box-shadow:0 0 0 4px rgba(101,198,91,.15)}
.actions{display:grid;grid-template-columns:1fr 120px;gap:10px;margin-top:15px}.btn{border:0;border-radius:15px;padding:12px 15px;font-weight:900;font-size:17px;cursor:pointer}
.primary{background:linear-gradient(135deg,#258647,#5fc958);color:white;box-shadow:0 9px 20px rgba(31,125,63,.22)}.secondary{background:#eef5ed;color:#5e7462}.primary:active,.secondary:active{transform:scale(.98)}
.chart-card{padding:20px;min-width:0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 16px}
.sum{border-radius:18px;padding:14px;background:#f8fcf7;border:1px solid #e0ede0;text-align:center}.sum .v{font-size:28px;font-weight:900;color:#176b35;line-height:1.1}.sum .k{font-size:12px;color:var(--muted);margin-top:4px}
.chart{position:relative;height:500px;border-radius:22px;padding:28px 18px 52px 48px;background:repeating-linear-gradient(to top,rgba(96,132,101,.11) 0 1px,transparent 1px 70px),linear-gradient(#fcfffb,#f5fbf3);border:1px solid #e0ede0;overflow:hidden}
.ylabel{position:absolute;left:14px;top:14px;color:#6b7e70;font-size:13px;font-weight:700}.bars{height:100%;display:flex;align-items:flex-end;justify-content:space-around;gap:10px}
.barcol{flex:1;min-width:48px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.value{font-size:19px;font-weight:900;margin-bottom:6px;opacity:0;transform:translateY(8px);transition:.35s .15s}.barcol.ready .value{opacity:1;transform:none}
.bar{width:min(64px,74%);height:0;border-radius:15px 15px 6px 6px;transition:height .8s cubic-bezier(.2,.8,.2,1);box-shadow:0 6px 14px rgba(0,0,0,.10)}
.label{position:absolute;bottom:13px;width:80px;text-align:center;font-size:12px;font-weight:900;color:#354d3a}
.legend-note{margin-top:13px;padding:12px 15px;border-radius:15px;background:#fff7d9;color:#745915;font-size:14px;font-weight:800}.result-line{margin-top:10px;text-align:center;font-size:18px;font-weight:900;color:#176b35;min-height:28px}
@media(max-width:980px){.main{grid-template-columns:1fr}.inputs{grid-template-columns:repeat(3,1fr)}.chart{height:430px}}
@media(max-width:720px){.inputs{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.chart{height:390px;padding-left:26px}.bar{width:68%}.label{font-size:10px;width:62px}}
@media(max-width:480px){.app{padding:10px}.inputs{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.chart{height:360px}.item{grid-template-columns:38px 1fr 78px}.num{width:78px}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title-wrap">
      <div class="logo">📊</div>
      <div><h1>我最喜欢的节目</h1><div class="subtitle">输入每类节目人数，点击按钮自动生成统计结果</div></div>
    </div>
    <div class="badge">兴趣统计智能体</div>
  </div>
  <div class="main">
    <section class="card input-card">
      <h2>节目人数录入</h2>
      <div class="hint">只输入人数，不记录学生姓名；没有选择可填 0。</div>
      <div class="inputs" id="inputs"></div>
      <div class="actions"><button class="btn primary" id="generate">📊 生成统计结果</button><button class="btn secondary" id="reset">清空</button></div>
    </section>
    <section class="card chart-card">
      <h2>全班同学最喜欢的节目统计</h2>
      <div class="summary">
        <div class="sum"><div class="v" id="total">0</div><div class="k">总选择人数</div></div>
        <div class="sum"><div class="v" id="winner">—</div><div class="k">最受欢迎节目</div></div>
        <div class="sum"><div class="v" id="maxCount">0</div><div class="k">最高人数</div></div>
      </div>
      <div class="chart" aria-live="polite"><div class="ylabel">人数（人）</div><div class="bars" id="bars"></div></div>
      <div class="result-line" id="resultLine">请先输入人数，再点击“生成统计结果”。</div>
      <div class="legend-note">课堂使用提示：统计结果只展示兴趣差异，不比较“谁更好”。可以继续追问：“你为什么喜欢这一类节目？”</div>
    </section>
  </div>
</div>
<script>
(function(){
  const root=document;
  const programs=[
    {name:'动画',icon:'🦊',color:'#ff7f9f'},
    {name:'体育',icon:'⚽',color:'#45aaf2'},
    {name:'电影',icon:'🎬',color:'#ffb84d'},
    {name:'科普',icon:'🔭',color:'#61d59a'},
    {name:'艺术',icon:'🎨',color:'#b47be7'},
    {name:'美食',icon:'🍜',color:'#ff8fb8'},
    {name:'新闻',icon:'📰',color:'#56a6ee'},
    {name:'少儿',icon:'🧸',color:'#f0c94f'},
    {name:'纪录片',icon:'🌍',color:'#52cdb4'}
  ];
  const inputs=root.querySelector('#inputs'); const bars=root.querySelector('#bars');
  programs.forEach((p,i)=>{
    const item=document.createElement('label'); item.className='item';
    item.innerHTML='<div class="icon">'+p.icon+'</div><div class="name">'+p.name+'</div><input class="num" id="n'+i+'" type="number" min="0" max="99" step="1" value="0" aria-label="'+p.name+'人数">'; inputs.appendChild(item);
    const col=document.createElement('div'); col.className='barcol';
    col.innerHTML='<div class="value" id="v'+i+'" style="color:'+p.color+'">0</div><div class="bar" id="b'+i+'" style="background:'+p.color+'"></div><div class="label">'+p.icon+'<br>'+p.name+'</div>'; bars.appendChild(col);
  });
  function getValues(){return programs.map((p,i)=>{const el=root.querySelector('#n'+i);let v=Number(el.value);if(!Number.isFinite(v)||v<0)v=0;v=Math.min(99,Math.round(v));el.value=v;return v;});}
  function render(){
    const vals=getValues(); const total=vals.reduce((a,b)=>a+b,0); const max=Math.max(0,...vals); const winners=max>0?programs.filter((p,i)=>vals[i]===max).map(p=>p.name):[];
    root.querySelector('#total').textContent=total; root.querySelector('#maxCount').textContent=max; root.querySelector('#winner').textContent=winners.length?winners.join('、'):'—';
    const scaleMax=Math.max(1,max);
    programs.forEach((p,i)=>{const h=vals[i]===0?0:Math.max(4,vals[i]/scaleMax*92);root.querySelector('#v'+i).textContent=vals[i];root.querySelector('#b'+i).style.height=h+'%';root.querySelector('#b'+i).parentElement.classList.add('ready');});
    const line=root.querySelector('#resultLine');
    if(total===0)line.textContent='目前还没有录入人数。';
    else if(winners.length===1){const pct=Math.round(max/total*100);line.textContent='本次统计中，“'+winners[0]+'”选择人数最多，共 '+max+' 人，占全部选择的 '+pct+'%。';}
    else line.textContent='本次统计出现并列第一：'+winners.join('、')+'，每类均为 '+max+' 人。';
  }
  root.querySelector('#generate').addEventListener('click',render);
  root.querySelector('#reset').addEventListener('click',()=>{programs.forEach((p,i)=>{root.querySelector('#n'+i).value=0;root.querySelector('#v'+i).textContent=0;root.querySelector('#b'+i).style.height='0%';root.querySelector('#b'+i).parentElement.classList.remove('ready');});root.querySelector('#total').textContent=0;root.querySelector('#winner').textContent='—';root.querySelector('#maxCount').textContent=0;root.querySelector('#resultLine').textContent='请先输入人数，再点击“生成统计结果”。';});
  root.querySelectorAll('.num').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')render();}));
})();
</script>
</body>
</html>
